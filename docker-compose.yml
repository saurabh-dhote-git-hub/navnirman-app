services:
  mysql:
    image: mysql:8.4
    container_name: navnirman-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: navnirman
      MYSQL_USER: navnirman
      MYSQL_PASSWORD: local_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3307:3306"
    volumes:
      - navnirman_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "navnirman", "-plocal_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  navnirman_mysql_data:
