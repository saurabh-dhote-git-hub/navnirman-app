services:
  mysql:
    image: mysql:8.4
    container_name: navnirman-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-navnirman}
      MYSQL_USER: ${DB_USERNAME:-navnirman}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_password}
    ports:
      - "3306:3306"
    volumes:
      - navnirman_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-local_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  navnirman_mysql_data:
