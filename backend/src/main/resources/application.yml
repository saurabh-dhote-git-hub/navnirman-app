server:
  port: 8080
spring:
  application:
    name: navnirman-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:navnirman}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:navnirman}
    password: ${DB_PASSWORD:local_dev_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
app:
  jwt:
    secret: ${JWT_SECRET:local-development-only-secret-change-me-123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
management:
  endpoints:
    web:
      exposure:
        include: health,info
